# Used when ansible-playbook is run from this directory.
[defaults]
# ONTs restored in parallel. Raise for one run with: ansible-playbook -f 200 ...
# Every request lands on the one CMS server, so this is also the load put on CMS.
forks = 50
inventory = localhost,
localhost_warning = False
retry_files_enabled = False
display_skipped_hosts = False
callback_result_format = yaml
interpreter_python = auto_silent

[connection]
# Run each module without copying it to a temp file first. Roughly halves the run time.
pipelining = True

[inventory]
inventory_unparsed_warning = False
