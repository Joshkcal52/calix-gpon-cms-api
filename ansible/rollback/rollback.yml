---
# EMERGENCY ROLLBACK
#
# Restores the ONTs on one OLT (or one card, one PON port, one ONT) to the
# state recorded in the network-backups Git repository, by talking straight
# to the Calix CMS northbound interface.
#
# It does not depend on the provisioning API, Kafka or the workers, so it
# still works when they are the thing that is broken.
#
#   export CMS_NBI_URL=http://cms.example.internal:18080/cmsexc/ex/netconf
#   export CMS_NBI_USER=...  CMS_NBI_PASSWORD=...
#   cd ansible/rollback
#
#   ansible-playbook rollback.yml -e target_olt=OLT-04 --check     # show the plan, change nothing
#   ansible-playbook rollback.yml -e target_olt=OLT-04             # restore the whole OLT
#   ansible-playbook rollback.yml -e target_olt=OLT-04 -e target_card=1/2
#   ansible-playbook rollback.yml -e target_olt=OLT-04 -e target_interface=1/2/3
#   ansible-playbook rollback.yml -e target_olt=OLT-04 -e target_ont=1204
#   ansible-playbook rollback.yml -e target_olt=OLT-04 -e snapshot_version=3f2a9c1 -f 200
#
# What it changes: for every ONT in the snapshot that is in scope, it creates
# the ONT if it is missing, corrects it if it differs, and makes its Ethernet
# services match (see remove_extra_services in vars/main.yml). ONTs that are
# not in the snapshot are never touched. See README.md for the full rules.

- name: Plan the rollback
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Check what was asked for
      ansible.builtin.assert:
        that:
          - target_olt is defined
          - target_olt is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
          - "'..' not in target_olt"
          - target_card | default('') | string is match('^(\d+/\d+)?$')
          - target_interface | default('') | string is match('^(\d+/\d+/\d+)?$')
          - target_ont | default('') | string is match('^\d*$')
          - cms_username | length > 0
          - cms_password | length > 0
        fail_msg: >-
          Name the OLT to restore with -e target_olt=NAME. Optional scope:
          target_card=shelf/card, target_interface=shelf/card/port, target_ont=ID.
          CMS_NBI_USER and CMS_NBI_PASSWORD must be set in the environment.
        quiet: true

    - name: Make a scratch directory for the snapshot
      ansible.builtin.tempfile:
        state: directory
        prefix: network-backups-
      register: checkout
      check_mode: false
      changed_when: false

    - name: Pull the snapshot from the network-backups repository
      ansible.builtin.git:
        repo: "{{ backup_repo }}"
        dest: "{{ checkout.path }}"
        version: "{{ snapshot_version }}"
      register: backup
      check_mode: false
      changed_when: false

    - name: Read when that snapshot was committed
      ansible.builtin.command:
        argv: [git, -C, "{{ checkout.path }}", log, "-1", "--format=%cI"]
      register: backup_date
      check_mode: false
      changed_when: false

    - name: Load the snapshot for {{ target_olt }}
      ansible.builtin.include_vars:
        file: "{{ checkout.path }}/{{ snapshot_dir }}/{{ target_olt }}.yml"
        name: snapshot

    - name: Check that the snapshot is the right one
      ansible.builtin.assert:
        that:
          - snapshot.format | default(0) | int == 1
          - snapshot.olt | default('') == target_olt
          - snapshot.network | default('') | length > 0
        fail_msg: >-
          {{ snapshot_dir }}/{{ target_olt }}.yml is not a format 1 snapshot of {{ target_olt }}.
          Nothing was changed.
        quiet: true

    - name: Select the ONTs in scope
      ansible.builtin.set_fact:
        scoped_onts: >-
          {{ snapshot.onts | default([])
             | rollback_scope(target_card | default('') | string,
                              target_interface | default('') | string,
                              target_ont | default('') | string) }}

    - name: Stop if nothing is in scope
      ansible.builtin.assert:
        that: scoped_onts | length > 0
        fail_msg: >-
          The snapshot of {{ target_olt }} has no ONTs matching that scope
          ({{ snapshot.onts | default([]) | length }} ONTs in the snapshot). Nothing was changed.
        quiet: true

    - name: Log in to CMS
      ansible.builtin.uri:
        url: "{{ cms_nbi_url }}"
        method: POST
        body: "{{ lookup('ansible.builtin.template', 'login.xml.j2') }}"
        headers:
          Content-Type: text/xml;charset=ISO-8859-1
        return_content: true
        timeout: "{{ cms_timeout }}"
      register: login
      check_mode: false
      no_log: true

    - name: Keep the CMS session
      ansible.builtin.set_fact:
        cms_session: "{{ login.content | cms_session_id }}"

    - name: Show the plan
      ansible.builtin.debug:
        msg:
          - "{{ 'DRY RUN (--check): nothing will be changed' if ansible_check_mode else 'RESTORING' }}"
          - "OLT {{ target_olt }} (CMS network {{ snapshot.network }}) at {{ cms_nbi_url }}"
          - "Snapshot commit {{ backup.after[:12] }}, committed {{ backup_date.stdout }}, captured {{ snapshot.captured_at | default('unknown') }}"
          - "{{ scoped_onts | length }} of {{ snapshot.onts | length }} ONTs in scope"

    - name: Queue each ONT for restore
      ansible.builtin.add_host:
        name: "ont-{{ item.ont_id }}"
        groups: rollback_onts
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        snapshot_ont: "{{ item }}"
        cms_session: "{{ cms_session }}"
        cms_network: "{{ snapshot.network }}"
      loop: "{{ scoped_onts }}"
      loop_control:
        label: "ONT {{ item.ont_id }}"
      changed_when: false


# One Ansible host per ONT, so --forks decides how many are restored at once.
- name: Restore ONTs
  hosts: rollback_onts
  connection: local
  gather_facts: false
  strategy: free
  vars_files:
    - vars/main.yml

  tasks:
    - name: Restore one ONT
      block:
        - name: Read the ONT from CMS
          ansible.builtin.uri:
            url: "{{ cms_nbi_url }}"
            method: POST
            body: "{{ lookup('ansible.builtin.template', 'ont_show.xml.j2') }}"
            headers:
              Content-Type: text/xml;charset=ISO-8859-1
            return_content: true
            timeout: "{{ cms_timeout }}"
          register: live_ont_reply
          check_mode: false
          failed_when: live_ont_reply.status != 200 or (live_ont_reply.content | cms_rpc_error | length > 0)

        - name: Read its services from CMS
          ansible.builtin.uri:
            url: "{{ cms_nbi_url }}"
            method: POST
            body: "{{ lookup('ansible.builtin.template', 'services_get.xml.j2') }}"
            headers:
              Content-Type: text/xml;charset=ISO-8859-1
            return_content: true
            timeout: "{{ cms_timeout }}"
          register: live_services_reply
          check_mode: false
          when: live_ont_reply.content | cms_onts | length > 0
          failed_when: live_services_reply.status != 200 or (live_services_reply.content | cms_rpc_error | length > 0)

        # The loop is the list of differences between the snapshot and CMS.
        # An ONT that already matches has an empty list and nothing is sent.
        - name: Make the ONT match the snapshot
          ansible.builtin.uri:
            url: "{{ cms_nbi_url }}"
            method: POST
            body: "{{ lookup('ansible.builtin.template', item.template) }}"
            headers:
              Content-Type: text/xml;charset=ISO-8859-1
            return_content: true
            timeout: "{{ cms_timeout }}"
          loop: >-
            {{ snapshot_ont | rollback_actions(
                 live_ont_reply.content | cms_onts | first | default({}),
                 (live_services_reply.content | cms_services) if live_services_reply.content is defined else [],
                 remove_extra_services | bool) }}
          loop_control:
            label: "{{ item.summary }}"
          register: applied
          when: not ansible_check_mode
          changed_when: true
          failed_when: applied.status != 200 or (applied.content | cms_rpc_error | length > 0)

      rescue:
        # Never let one ONT's failure stop the others, or stop the final report
        - name: Record the failure
          ansible.builtin.set_fact:
            rollback_error: "{{ ansible_failed_result | rollback_failure(ansible_failed_task.name) }}"


- name: Report
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Log out of CMS
      ansible.builtin.uri:
        url: "{{ cms_nbi_url }}"
        method: POST
        body: "{{ lookup('ansible.builtin.template', 'logout.xml.j2') }}"
        headers:
          Content-Type: text/xml;charset=ISO-8859-1
        timeout: "{{ cms_timeout }}"
      check_mode: false
      failed_when: false

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ checkout.path }}"
        state: absent
      check_mode: false
      changed_when: false

    - name: Collect the results
      ansible.builtin.set_fact:
        results: "{{ groups['rollback_onts'] | rollback_results(hostvars, ansible_check_mode) }}"

    - name: Write the run record
      ansible.builtin.copy:
        dest: "{{ report_path }}"
        mode: "0600"
        content: >-
          {{ {'olt': target_olt, 'network': snapshot.network, 'dry_run': ansible_check_mode,
              'snapshot_commit': backup.after, 'snapshot_committed_at': backup_date.stdout,
              'results': results} | to_nice_json }}
      when: report_path is defined
      check_mode: false

    - name: Changes made
      ansible.builtin.debug:
        msg: "{{ results | rejectattr('status', 'equalto', 'unchanged') | map(attribute='changes') | flatten }}"
      when: results | rejectattr('status', 'equalto', 'unchanged') | list | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "{{ target_olt }}: {{ results | length }} ONTs checked against snapshot {{ backup.after[:12] }}"
          - "already matching: {{ results | selectattr('status', 'equalto', 'unchanged') | list | length }}"
          - "{{ 'would be restored' if ansible_check_mode else 'restored' }}: {{ results | selectattr('status', 'in', ['restored', 'would_change']) | list | length }}"
          - "failed: {{ results | selectattr('status', 'equalto', 'failed') | list | length }}"

    - name: Fail the run if any ONT could not be restored
      ansible.builtin.fail:
        msg: >-
          {{ results | selectattr('status', 'equalto', 'failed') | list | length }} ONT(s) could not be restored:
          {{ results | selectattr('status', 'equalto', 'failed') | map(attribute='error') | join(' | ') }}
      when: results | selectattr('status', 'equalto', 'failed') | list | length > 0
