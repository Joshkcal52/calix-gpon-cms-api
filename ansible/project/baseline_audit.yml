---
# Baseline audit: confirm that the ONTs that should be in service are online.
#
# Started by the API (POST /api/v2/automation/playbooks/baseline_audit/runs),
# which validates the variables first:
#   network   CMS network name
#   ont_ids   ONT IDs expected to be online
#   api_url   base URL of this API (filled in by the API, not by the caller)
#
# The play talks to CMS only through the API. Plays for other vendors'
# devices (upstream routers and switches) belong in the same playbook as
# further plays against their own inventory groups.
- name: Baseline audit of ONTs on {{ network }}
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Check that the API can reach CMS
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v2/nbi/health"
        return_content: true
      register: health
      failed_when: health.json.breaker.state != "closed"

    - name: Read the status of the expected ONTs
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v2/networks/{{ network }}/onts/status-check"
        method: POST
        body_format: json
        body:
          ont_ids: "{{ ont_ids }}"
        return_content: true
      register: check

    - name: Work out which ONTs are not online
      ansible.builtin.set_fact:
        not_online: >-
          {{ check.json.results
             | rejectattr('ont.oper_state', 'defined')
             | map(attribute='ont_id') | list
             + check.json.results
             | selectattr('ont.oper_state', 'defined')
             | rejectattr('ont.oper_state', 'equalto', 'online')
             | map(attribute='ont_id') | list }}

    - name: Report the audit result
      ansible.builtin.assert:
        that: not_online | length == 0
        success_msg: "All {{ check.json.checked }} ONTs on {{ network }} are online"
        fail_msg: "{{ not_online | length }} of {{ check.json.checked }} ONTs on {{ network }} are not online: {{ not_online | join(', ') }}"
