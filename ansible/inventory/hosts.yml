# Inventory for playbooks run by the API.
#
# Calix gear is NOT listed here on purpose: playbooks reach CMS only through
# this API (the `uri` module against {{ api_url }}), so CMS access has a single
# owner with one circuit breaker and one set of limits.
#
# Add other vendors' devices as groups, for example:
#
#   core_routers:
#     hosts:
#       core-rtr-1:
#         ansible_host: 192.0.2.1
#         ansible_network_os: junipernetworks.junos.junos
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
