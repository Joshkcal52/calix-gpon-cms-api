# How legacy CMS values become SMx values in a cutover plan (python -m app.legacy.smx).
# Point SMX_MAP_PATH at your own copy.
#
# THESE ENTRIES ARE DEMO VALUES that match the simulated CMS. Replace every one.
# On a real CMS the bandwidth profile and tag action keys are numeric IDs.
#
# A subscriber whose CMS data uses a value not listed here fails with a message
# naming it, and gets no requests. Nothing is guessed.

# CMS ONT profile -> SMx ONT Profile ID (for the kept ONT, or its replacement)
ont_profiles:
  "716GE-I": "DEMO-PROFILE-716GE"
  "812G-1": "DEMO-PROFILE-812G"
  "844G-1": "DEMO-PROFILE-844G"

# CMS bandwidth profile -> SMx Policy Map
bandwidth_profiles:
  "RES-1G": "DEMO-POLICY-RESI-1G"
  "VOICE": "DEMO-POLICY-VOICE"

# CMS service tag action -> how the SMx VLAN and c-VLAN are set.
#   vlan:   outer (the service's outer tag on CMS) or a fixed number
#   c_vlan: inner (the service's inner tag on CMS), none, or a fixed number
tag_actions:
  "1": {vlan: outer, c_vlan: none}
  "2": {vlan: outer, c_vlan: none}

# CMS port (eth1..eth8, rg1) -> SMx ONT Port ID. Every Ethernet port is listed,
# because each port's mode is carried over, not only the ports with services.
ont_ports:
  eth1: "DEMO-PORT-1"
  eth2: "DEMO-PORT-2"
  eth3: "DEMO-PORT-3"
  eth4: "DEMO-PORT-4"
  rg1: "DEMO-PORT-RG"

# Each Ethernet port's mode as CMS reports it -> SMx value. A port whose mode
# could not be read fails the subscriber; nothing is defaulted. 844Gs that ran
# as bridges and were rebuilt as router/ONT combos gave customers double NAT.
port_modes:
  bridge: "DEMO-BRIDGE"
  router: "DEMO-ROUTER"

# CMS admin state -> SMx Admin State
admin_states:
  enabled: "DEMO-ENABLED"
  disabled: "DEMO-DISABLED"

# CMS peak-rate overrides (us-pir-override / ds-pir-override, e.g. "100m") ->
# SMx. Not set here: how SMx takes a peak rate is not known. While it is unset,
# a service with an override other than "none" fails its subscriber.
#   peak_rate_overrides:
#     upstream_parameter: "<SMx parameter name>"
#     downstream_parameter: "<SMx parameter name>"
#     values: {"100m": "<SMx value>"}

# SMx Service Name for each data service. Placeholders: {account}, {port}, {index}
service_name: "{account}-{port}-{index}"

# Passed through unchanged as SMx parameters on every request of that kind
subscriber_defaults:
  Add-Update Mode: Add-Only
ont_defaults:
  Add-Update Mode: Add-Only
  Type: Residential
  ONT Type: Local
  Auto-Generate: true
data_service_defaults:
  Add-Update Mode: Add-Only
