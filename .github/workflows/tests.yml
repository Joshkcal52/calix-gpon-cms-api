# Runs the whole test suite on Linux against the pinned versions in
# requirements-test.txt, on every push and pull request. Nothing here needs a
# CMS, Kafka or any secret: the suite uses the mock CMS and librdkafka's
# built-in mock Kafka cluster.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Show what was installed
        run: pip freeze
      - name: Run the tests
        run: python -m pytest -q -rs
